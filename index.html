<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f3f1ec" />
<meta name="apple-mobile-web-app-title" content="Trendy Man" />
<title>Trendy Man — Suit &amp; Tie Color Matcher</title>
<style>
  :root{
    --bg:#f3f1ec; --bg2:#ece7f1; --bg3:#e6eef0;
    --card:#ffffff; --card2:#f6f4f0;
    --ink:#2b2f3a; --muted:#8a8f9b; --line:#e9e5df; --line2:#efece6;
    --accent:#9a7ba5;        /* dusty mauve */
    --accent2:#7f93b0;       /* soft slate blue */
    --good:#3fa67a; --goodbg:#e1f3ea;
    --great:#bd9a45; --greatbg:#f7efd8;
    --ok:#9aa0ab;  --okbg:#eef0f3;
    --avoid:#cf7a7a; --avoidbg:#fae6e6;
    --radius:20px; --r2:14px;
    --shadow:0 10px 30px rgba(60,50,70,.08);
    --shadow2:0 4px 14px rgba(60,50,70,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg2), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, var(--bg3), transparent 55%),
      var(--bg);
    color:var(--ink); min-height:100vh; padding:env(safe-area-inset-top) 18px 48px;
    line-height:1.45; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1240px; margin:0 auto;}
  header{padding:22px 4px 14px; text-align:center;}
  header h1{margin:0; font-size:27px; letter-spacing:.3px; font-weight:700;}
  header h1 .ac{color:var(--accent);}
  header p{margin:6px 0 0; color:var(--muted); font-size:13.5px;}

  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted); margin:0 0 10px 4px; font-weight:700;}

  .skin-bar{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:6px 0 18px; box-shadow:var(--shadow2);}
  .skin-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .skin-opt{display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 6px; border-radius:var(--r2); border:2px solid transparent; background:var(--card2); cursor:pointer; transition:.15s;}
  .skin-opt .dot{width:42px; height:42px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), 0 2px 6px rgba(0,0,0,.08);}
  .skin-opt span{font-size:12px; color:var(--muted); text-align:center; font-weight:600;}
  .skin-opt.active{border-color:var(--accent); background:#f3edf6;}
  .skin-opt.active span{color:var(--ink);}

  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px;}
  .tab{flex:1 1 auto; min-width:108px; text-align:center; padding:13px 10px; border-radius:var(--r2); background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:14px; font-weight:700; cursor:pointer; transition:.15s; box-shadow:var(--shadow2);}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}

  .layout{display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }

  .look-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px 20px; position:sticky; top:10px; box-shadow:var(--shadow);}
  @media (max-width:880px){ .look-card{position:static;} }
  .viewsw{display:flex; gap:5px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:4px; margin:0 0 12px;}
  .vbtn{flex:1; text-align:center; padding:8px 4px; border-radius:9px; border:none; background:transparent; color:var(--muted); font:700 12px -apple-system,sans-serif; cursor:pointer; transition:.12s;}
  .vbtn.active{background:#fff; color:var(--ink); box-shadow:0 2px 6px rgba(60,50,70,.10);}
  .stage{background:linear-gradient(180deg,#faf8f4,#efeaf2); border-radius:16px; padding:8px 0; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:320px;}
  .figure{width:100%; max-width:262px; display:block; margin:0 auto;}
  .figfull{max-width:152px;}
  .swwrap{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; width:100%;}
  .sw{height:100px; border-radius:14px; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .sw b{position:absolute; left:9px; bottom:9px; background:rgba(255,255,255,.92); color:var(--ink); font:800 12px -apple-system,sans-serif; padding:3px 10px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .sw small{position:absolute; right:9px; top:9px; font:800 9px -apple-system,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:rgba(43,47,58,.55); background:rgba(255,255,255,.78); padding:2px 7px; border-radius:7px;}
  .rating{display:flex; align-items:center; justify-content:center; gap:9px; margin:14px 0 14px; font-size:14px; font-weight:700;}
  .rating .lab{color:var(--muted); font-weight:600; font-size:13px;}
  .pill{padding:4px 14px; border-radius:999px; font-size:13px; font-weight:700;}
  .look-rows{display:flex; flex-direction:column; gap:9px;}
  .look-row{display:flex; align-items:center; gap:12px; background:var(--card2); border-radius:12px; padding:9px 12px;}
  .look-row .sw{width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); flex:none;}
  .look-row .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; font-weight:700;}
  .look-row .val{font-size:14px; font-weight:600;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
  .panel h2{margin:0 0 4px; font-size:19px;}
  .panel .hint{color:var(--muted); font-size:13px; margin:0 0 16px;}

  .pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:11px;}
  .pick{cursor:pointer; border-radius:var(--r2); padding:8px; background:var(--card2); border:2px solid transparent; text-align:center; transition:.12s;}
  .pick .chip{height:50px; border-radius:10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.07); margin-bottom:7px;}
  .pick .nm{font-size:12px; font-weight:600; line-height:1.15;}
  .pick.active{border-color:var(--accent); background:#f3edf6;}
  .pick .tux{display:inline-block; font-size:9px; font-weight:800; letter-spacing:.5px; color:var(--accent); background:#f0e9f3; padding:1px 5px; border-radius:6px; margin-top:3px;}

  .rec-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:22px;}
  @media (max-width:660px){ .rec-wrap{grid-template-columns:1fr;} }
  .rec-col h3{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:0 0 11px; font-weight:800;}
  .rec-item{display:flex; align-items:center; gap:12px; padding:9px 11px; border-radius:12px; background:var(--card2); margin-bottom:8px; cursor:pointer; border:2px solid transparent; transition:.12s;}
  .rec-item:active{transform:scale(.99);}
  .rec-item.active{border-color:var(--accent); background:#f3edf6;}
  .rec-item .sw{width:34px; height:34px; border-radius:9px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); flex:none;}
  .rec-item .info{flex:1; min-width:0;}
  .rec-item .info .nm{font-size:14px; font-weight:600;}
  .rec-item .info .why{font-size:11.5px; color:var(--muted); line-height:1.3;}
  .src{color:var(--accent); font-weight:700;}
  .why-overall{font-size:12.5px; color:var(--muted); text-align:center; margin:-6px 0 14px; padding:0 8px; line-height:1.35;}
  .tag{font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap;}
  .t2{background:var(--goodbg); color:var(--good);}
  .t1{background:var(--greatbg); color:var(--great);}
  .t0{background:var(--avoidbg); color:var(--avoid);}

  .note{background:linear-gradient(135deg,#f6f0f8,#eef1f6); border:1px solid var(--line); border-radius:14px; padding:13px 15px; font-size:13px; color:var(--ink); margin-top:18px;}
  .note b{color:var(--accent);}

  .matrix-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:8px; padding-bottom:8px;}
  table.matrix{border-collapse:separate; border-spacing:5px;}
  .mx-corner{font-size:11px; color:var(--muted); text-align:left; font-weight:700; padding:0 4px;}
  .mx-colhead{display:flex; flex-direction:column; align-items:center; gap:4px; width:50px;}
  .mx-colhead .chip{width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .mx-colhead .t{font-size:9.5px; color:var(--muted); line-height:1.05; text-align:center; font-weight:600;}
  .mx-rowhead{display:flex; align-items:center; gap:9px; padding-right:8px;}
  .mx-rowhead .chip{width:30px; height:30px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); flex:none;}
  .mx-rowhead .t{font-size:12.5px; font-weight:600; white-space:nowrap;}
  .mx-rowhead .star{color:var(--accent); font-size:11px;}
  .mx-cell{width:46px; height:46px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid transparent; transition:.1s;}
  .mx-cell .tie{width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.12);}
  .mx-cell.sel{border-color:var(--ink);}
  .mx-row.dim{opacity:.34;}
  .cell2{background:var(--goodbg);} .cell1{background:var(--greatbg);} .cell0{background:var(--avoidbg);}
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:18px; font-size:12px; color:var(--muted);}
  .legend .k{display:flex; align-items:center; gap:6px;}
  .legend .b{width:16px; height:16px; border-radius:5px;}
  .mx-help{font-size:12.5px; color:var(--muted); margin:12px 4px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="ac">Trendy Man</span> — Suit &amp; Tie Color Matcher</h1>
    <p>Pick any piece and get fashion-matched suggestions for the rest — tuned to your skin tone.</p>
  </header>

  <div class="skin-bar">
    <p class="section-title">1 · Your skin tone</p>
    <div class="skin-grid" id="skinGrid"></div>
  </div>

  <p class="section-title">2 · Start from…</p>
  <div class="tabs" id="tabs">
    <div class="tab" data-mode="suit">Suit</div>
    <div class="tab" data-mode="shirt">Shirt</div>
    <div class="tab" data-mode="tie">Tie</div>
    <div class="tab" data-mode="skin">Skin tone</div>
    <div class="tab" data-mode="matrix">Full matrix</div>
  </div>

  <div class="layout">
    <div class="look-card">
      <div class="viewsw" id="viewSwitch">
        <button class="vbtn" data-view="avatar">Avatar</button>
        <button class="vbtn" data-view="full">Full</button>
        <button class="vbtn" data-view="flatlay">Flat-lay</button>
        <button class="vbtn" data-view="swatch">Swatches</button>
      </div>
      <div class="stage" id="stage" aria-label="Outfit preview"></div>
      <div class="rating" id="rating"></div>
      <div class="why-overall" id="overallWhy"></div>
      <div class="look-rows" id="lookRows"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
/* ===================== ITEMS ===================== */
const SKINS = [
  {id:'fair',   name:'Fair / Light', hex:'#f0d2bb', hair:'#17171b', note:'Crisp white and soft pastel shirts flatter fair skin; bring colour through the tie. Mid-to-deep suits create flattering contrast — very pale suits can wash you out.'},
  {id:'medium', name:'Medium',       hex:'#d9a980', hair:'#17171b', note:'The most versatile tone — almost every suit colour works. Earth tones, blues and jewel-tone ties all sit beautifully against medium skin.'},
  {id:'olive',  name:'Olive / Tan',  hex:'#b07c4f', hair:'#161618', note:'Warm, earthy suits (olive, brown, tan) and warm ties harmonise with olive skin. Lift cool greys with a warmer tie or pocket square.'},
  {id:'deep',   name:'Deep / Dark',  hex:'#6e4326', hair:'#141416', note:'Light-grey and tan suits plus bright or jewel-tone ties create a striking contrast. White and pastel shirts really pop against deep skin.'},
];

const SUITS = [
  {id:'navy',        name:'Navy',            hex:'#20304f', neutral:true},
  {id:'charcoal',    name:'Charcoal',        hex:'#3a3d42', neutral:true},
  {id:'lightgrey',   name:'Light Grey',      hex:'#b9bec6', neutral:true},
  {id:'black',       name:'Black',           hex:'#1c1c1e', neutral:true},
  {id:'brown',       name:'Brown',           hex:'#5b3a29'},
  {id:'tan',         name:'Tan / Beige',     hex:'#c2a273'},
  {id:'blue',        name:'Bright Blue',     hex:'#3a5f9e'},
  {id:'burgundy',    name:'Burgundy',        hex:'#5d2433'},
  {id:'olive',       name:'Olive',           hex:'#5c5d3a'},
  {id:'rosegold',    name:'Rose Gold',       hex:'#c0857f'},
  {id:'fuchsia',     name:'Fuchsia',         hex:'#c42a72'},
  {id:'lightblue',   name:'Light Blue',      hex:'#a9c8e6'},
  {id:'slateblue',   name:'Slate Blue',      hex:'#5d6e90'},
  {id:'lightpink',   name:'Light Pink',      hex:'#e7b8c3'},
  {id:'navycheck',   name:'Navy Checkered',  hex:'#27334f', neutral:true, pattern:'check'},
  {id:'greycheck',   name:'Grey Checkered',  hex:'#70757d', neutral:true, pattern:'check'},
  {id:'blackcheck',  name:'Black Checkered', hex:'#262629', neutral:true, pattern:'check'},
  {id:'blacktux',    name:'Black Tuxedo',    hex:'#16161a', neutral:true, tux:true},
  {id:'greytux',     name:'Light Grey Tux',  hex:'#b6bcc4', neutral:true, tux:true},
  {id:'burgundytux', name:'Burgundy Tuxedo', hex:'#5a2030', tux:true},
  {id:'navytux',     name:'Navy Tuxedo',     hex:'#1c2742', neutral:true, tux:true},
  {id:'whitetux',    name:'White Tuxedo',    hex:'#efeee7', neutral:true, tux:true},
];

const SHIRTS = [
  {id:'white',     name:'White',        hex:'#ffffff', neutral:true},
  {id:'ivory',     name:'Ivory',        hex:'#f5efe0', neutral:true},
  {id:'lightblue', name:'Light Blue',   hex:'#d0e2f2', neutral:true},
  {id:'sky',       name:'Sky (bright)', hex:'#9ad2f0'},
  {id:'blue',      name:'Blue',         hex:'#6f9bd1'},
  {id:'navy',      name:'Navy',         hex:'#2c3c5e', neutral:true},
  {id:'grey',      name:'Grey',         hex:'#cccfd4', neutral:true},
  {id:'black',     name:'Black',        hex:'#2b2b2e', neutral:true},
  {id:'pink',      name:'Pink',         hex:'#f5ced7'},
  {id:'peach',     name:'Peach',        hex:'#f8d2ba'},
  {id:'lavender',  name:'Lavender',     hex:'#ddd2f0'},
  {id:'purple',    name:'Purple',       hex:'#b69ce0'},
  {id:'burgundy',  name:'Burgundy',     hex:'#7c3142'},
  {id:'yellow',    name:'Yellow',       hex:'#f3e58c'},
  {id:'banana',    name:'Banana Yellow',hex:'#f7e76a'},
  {id:'gold',      name:'Gold',         hex:'#dcbb5c'},
  {id:'orange',    name:'Orange',       hex:'#f0a763'},
  {id:'deepgreen', name:'Deep Green',   hex:'#2f6149'},
  {id:'green',     name:'Bright Green', hex:'#5fc591'},
  {id:'red',       name:'Red',          hex:'#d65a5a'},
];

const TIES = [
  {id:'burgundy', name:'Burgundy',     hex:'#6e2436', universal:true, dressy:true},
  {id:'navy',     name:'Navy',         hex:'#21314f', neutral:true, universal:true, dressy:true},
  {id:'royalblue',name:'Royal Blue',   hex:'#2f4f92'},
  {id:'sky',      name:'Sky Blue',     hex:'#6cb7e6'},
  {id:'silver',   name:'Silver',       hex:'#c2c6cc', neutral:true, universal:true, dressy:true},
  {id:'charcoal', name:'Charcoal Grey',hex:'#444a55', neutral:true, dressy:true},
  {id:'forest',   name:'Forest Green', hex:'#234d36', dressy:true},
  {id:'emerald',  name:'Emerald',      hex:'#1f8f5f', dressy:true},
  {id:'olive',    name:'Olive',        hex:'#6b6f3a'},
  {id:'pink',     name:'Pink',         hex:'#e487a0'},
  {id:'blush',    name:'Blush / Peach',hex:'#f0b59b'},
  {id:'gold',     name:'Gold',         hex:'#c79a37', dressy:true},
  {id:'yellow',   name:'Yellow',       hex:'#ead24f'},
  {id:'orange',   name:'Orange',       hex:'#e07b34'},
  {id:'purple',   name:'Purple',       hex:'#6a3f8f', dressy:true},
  {id:'lavender', name:'Lavender',     hex:'#b9a7e0'},
  {id:'brown',    name:'Brown',        hex:'#5b3a29'},
  {id:'tan',      name:'Tan',          hex:'#c2a273'},
  {id:'black',    name:'Black',        hex:'#1c1c1e', neutral:true, dressy:true},
  {id:'red',      name:'Red',          hex:'#b22230', dressy:true},
  {id:'teal',     name:'Teal',         hex:'#1f8a8f'},
  {id:'coral',    name:'Coral',        hex:'#ef7d6a'},
];

/* ===================== COLOR MODEL ===================== */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
  const d=mx-mn;
  if(d!==0){
    s=d/(1-Math.abs(2*l-1));
    if(mx===r) h=60*(((g-b)/d)%6);
    else if(mx===g) h=60*(((b-r)/d)+2);
    else h=60*(((r-g)/d)+4);
  }
  if(h<0)h+=360;
  return {h, s:s*100, l:l*100};
}
function tempOf(h,s,neutral){
  if(neutral || s<12) return 'neutral';
  if(h>=330 || h<70) return 'warm';     /* reds, oranges, yellows, browns, gold */
  if(h<160) return 'green';             /* yellow-greens to greens: versatile */
  return 'cool';                        /* blues, teal, purples, magenta */
}
function attach(o){ const c=hexToHsl(o.hex); o.h=c.h; o.s=c.s; o.l=c.l; o.temp=tempOf(c.h,c.s,o.neutral); }
[...SUITS,...SHIRTS,...TIES,...SKINS].forEach(attach);
const hueDist=(a,b)=>{ let d=Math.abs(a-b)%360; return d>180?360-d:d; };

/* ===================== SCORING ENGINE =====================
   Built on menswear colour rules from FashionBeans, The Tie Bar, Hockerty,
   Suits Expert, TieMart, The Black Tux and skin-tone colour-analysis guides:
   - the shirt should be the lightest piece; the tie should be darker than the shirt
   - never match a piece to a near-identical shade (navy tie + navy suit = off)
   - adjacent loud hues clash; complementary hues pop; earth tones harmonise
   - black suits reject tan / light-brown / beige accents
   - fair skin needs contrast (pale suits wash it out); deep skin pops in light tones;
     olive favours warm browns/olive but goes sallow in pale beige; medium is versatile
*/
function tempHarmony(a,b){
  if(a===b && a!=='neutral') return 0.55;
  if(a==='neutral'||b==='neutral') return 0.28;
  if(a==='green'||b==='green') return 0.4;
  return 0.18;
}
function clamp(x){ return Math.max(0, Math.min(3, x)); }

function scoreSuitShirt(S,H){
  let s=1.0;
  if(S.l<45){                       /* dark suit wants a clearly lighter shirt */
    if(H.l>78) s+=1.5; else if(H.l>60) s+=1.0; else if(H.l>46) s+=0.2; else s-=1.0;
  } else if(S.l>62){                /* light suit */
    if(H.l>84) s+=1.0; else if(H.l>64) s+=0.3; else if(H.l<42) s+=0.4; else s-=0.2;
  } else {                          /* mid-tone suit */
    if(H.l>72) s+=0.9; else if(H.l<40) s+=0.2; else s+=0.1;
  }
  if(H.neutral) s+=0.5;
  if(S.s>22 && H.s>22){             /* both have real colour */
    const dh=hueDist(S.h,H.h);
    if(dh<18 && Math.abs(S.l-H.l)<22) s-=1.3;     /* shirt = suit colour: looks off */
    else if(dh<18) s+=0.1;
    else if(dh<55 && Math.abs(S.l-H.l)<30) s-=0.6; /* two colours fighting */
  }
  if(H.s>55 && H.l<74) s-=0.55;     /* loud coloured shirt = risky under a suit */
  if(S.tux){ if(H.id==='white'||H.id==='ivory') s+=1.4; else if(H.id==='black') s+=0.5; else s-=1.9; }
  return clamp(s);
}
function scoreSuitTie(S,T){
  let s=1.0;
  if(T.universal) s+=0.8;
  s+=tempHarmony(S.temp,T.temp);
  if(S.s>18 && T.s>18){
    const dh=hueDist(S.h,T.h);
    if(dh<16 && Math.abs(S.l-T.l)<20) s-=1.4;       /* tie = suit colour: too matchy */
    else if(dh<16) s+=0.25;                          /* tonal, clearly different depth */
    else if(dh<48){ if(S.s>45 && T.s>45) s-=0.5; else s+=0.15; } /* adjacent: clash only if both vivid */
    else if(dh>=150) s+=0.45;                         /* complementary pop */
    else s+=0.2;
  }
  if((S.temp==='warm'||S.temp==='green')&&(T.temp==='warm'||T.temp==='green')) s+=0.2; /* earth-tone harmony */
  if(S.l<42 && T.l>60 && !T.neutral) s+=0.25;        /* mid/rich tie pops on a dark suit */
  if(!T.neutral && T.l>62 && T.l>S.l+22) s-=0.4;     /* genuinely pale tie floats / washes out */
  if((S.id==='black'||S.id==='blacktux') && ['tan','brown','olive','gold'].includes(T.id)) s-=1.2; /* warm earth ties clash with black */
  if(S.tux){ s += T.dressy ? 1.2 : -1.3; }
  return clamp(s);
}
function scoreShirtTie(H,T){
  let s=1.0;
  if(H.id==='white') s+=1.05; else if(H.neutral) s+=0.4;
  const dl=H.l-T.l;                                   /* +ve = tie darker than shirt (correct) */
  const both=H.s>18 && T.s>18;
  const dh=both?hueDist(H.h,T.h):999;
  if(dh<16){                                          /* same colour family (tonal) */
    if(dl>34) s+=0.8; else if(dl>18) s+=0.45; else if(dl>8) s-=0.2; else s-=1.2; /* tie must be clearly darker */
    if(H.l>72 && T.l>60) s-=0.4;                       /* light-on-light tonal washes out */
  } else {                                            /* different hue */
    if(dl>30) s+=1.0; else if(dl>14) s+=0.5; else if(dl>-2) s-=0.4; else s-=1.3; /* tie lighter than shirt = wrong */
    if(H.l>70 && T.l>66 && !T.neutral && !H.neutral) s-=0.8;  /* pastel shirt + pastel tie */
    if(both){
      if(dh<55){ if(H.s>42 && T.s>42) s-=0.7; else s+=0.1; }  /* adjacent clash if both vivid */
      else if(dh>=140) s+=0.6;                                 /* complementary pop */
      else s+=0.2;
    }
  }
  if(T.id==='black' && H.l>72) s+=0.2;
  return clamp(s);
}
function scoreSkinSuit(skin,S){
  let s=1.3;
  s += Math.min(Math.abs(S.l-skin.l),46)/46;          /* contrast helps almost everyone */
  if(S.neutral) s+=0.35;
  if(skin.id==='fair'){                               /* needs contrast; pale/beige suits wash out */
    if(S.l>80) s-=1.2;
    else if(S.l>56 && (S.temp==='warm'||S.id==='tan')) s-=0.9;  /* tan/camel/beige mimic fair skin */
    else if(S.l>62) s-=0.6;
    else if(S.l>=18) s+=0.5;
  }
  if(skin.id==='medium'){ s+=0.35; if(S.temp==='warm') s+=0.2; }
  if(skin.id==='olive'){
    if(S.temp==='warm'||S.id==='olive') s+=0.5;
    if(S.id==='tan') s-=0.4;                           /* pale beige can look sallow */
    if(S.id==='lightgrey'||S.id==='greytux') s-=0.2;
  }
  if(skin.id==='deep'){ if(S.l>60) s+=0.7; }           /* light/bright suits pop on deep skin */
  return clamp(s);
}

/* Each returns [reason, source] — negatives are checked first so a clash is always explained */
function explainSuitShirt(S,H){
  if(S.tux){
    if(H.id==='white'||H.id==='ivory') return ['A crisp white shirt is the black-tie standard.','The Black Tux'];
    if(H.id==='black') return ['Black-on-black is a sharp modern black-tie move.','The Black Tux'];
    return ['A coloured shirt breaks black-tie rules — wear white.','The Black Tux'];
  }
  if(S.s>22 && H.s>22){
    const dh=hueDist(S.h,H.h);
    if(dh<18 && Math.abs(S.l-H.l)<22) return ['Almost the same shade as the suit — reads as a mismatch.','The Tie Bar'];
    if(dh>=18 && dh<55 && Math.abs(S.l-H.l)<30) return ['Two strong colours fighting — they clash.','FashionBeans'];
  }
  if(H.s>55 && H.l<74) return ['A loud coloured shirt is hard to carry under a suit.','FashionBeans'];
  if(S.l<45){
    if(H.l>78) return ['Shirt sits clearly lighter than the suit — crisp contrast.','FashionBeans'];
    if(H.l>60) return ['Lighter shirt gives good contrast with the dark suit.','FashionBeans'];
    if(H.l<46) return ['Dark shirt on a dark suit — too little contrast.','FashionBeans'];
  } else if(S.l>62){
    if(H.l>84) return ['White lifts a light suit cleanly.','Suits Expert'];
    if(H.l<42) return ['A dark shirt is a bold contrast on a light suit.','Suits Expert'];
  } else if(H.l>72) return ['Light shirt over a mid-tone suit — clean and classic.','FashionBeans'];
  if(H.neutral) return ['A no-fail neutral shirt — pairs with anything.','Hockerty'];
  return ['A workable, balanced pairing.','FashionBeans'];
}
function explainSuitTie(S,T){
  if(S.tux) return T.dressy ? ['A formal tie fit for black-tie.','The Black Tux'] : ['Too casual or bright for black-tie.','The Black Tux'];
  if((S.id==='black'||S.id==='blacktux') && ['tan','brown','olive','gold'].includes(T.id))
     return ['Warm browns and tans clash with a black suit.','TieMart'];
  if(S.s>18 && T.s>18){
    const dh=hueDist(S.h,T.h);
    if(dh<16 && Math.abs(S.l-T.l)<20) return ['Same colour as the suit — too matchy.','The Tie Bar'];
    if(dh>=16 && dh<48 && S.s>45 && T.s>45) return ['Adjacent loud hues — they clash.','FashionBeans'];
    if(dh>=150) return ['Opposite the suit on the colour wheel — strong contrast.','The Tie Bar'];
  }
  if(!T.neutral && T.l>62 && T.l>S.l+22) return ['Tie too pale against the suit — it floats.','Hockerty'];
  if(T.universal) return ['Burgundy, navy and silver are near-universal ties.','TieMart'];
  if((S.temp==='warm'||S.temp==='green')&&(T.temp==='warm'||T.temp==='green')) return ['Warm earth tones harmonise.','The Black Tux'];
  if(S.l<42 && T.l>60) return ['A richer tie pops against the dark suit.','Suits Expert'];
  return ['A safe, harmonious tie choice.','TieMart'];
}
function explainShirtTie(H,T){
  const dl=H.l-T.l, both=H.s>18&&T.s>18, dh=both?hueDist(H.h,T.h):999;
  if(dh<16){
    if(dl<=8) return ['Tie barely differs from the shirt — too matchy.','The Tie Bar'];
    if(dl>18) return ['Same family but clearly darker tie — clean tonal look.','Hockerty'];
    return ['Same colour family, not enough depth difference.','The Tie Bar'];
  }
  if(dl<-2) return ['Tie is lighter than the shirt — looks washed out.','FashionBeans'];
  if(H.l>70 && T.l>66 && !T.neutral && !H.neutral) return ['Pastel shirt with a pastel tie — too little contrast.','FashionBeans'];
  if(both && dh<55 && H.s>42 && T.s>42) return ['Adjacent bold hues (like red & orange) — they clash.','FashionBeans'];
  if(both && dh>=140) return ['Complementary colours — sharp, balanced contrast.','The Tie Bar'];
  if(H.id==='white') return ['A white shirt takes almost any darker tie.','Hockerty'];
  if(dl>30) return ['Tie darker than the shirt — correct, with good contrast.','FashionBeans'];
  return ['A balanced, harmonious match.','FashionBeans'];
}
function explainSkinSuit(skin,S){
  if(skin.id==='fair'){
    if(S.l>80) return ['Very pale suit washes out fair skin.','Suits & More'];
    if(S.l>56 && (S.temp==='warm'||S.id==='tan')) return ['Beige/tan mimics fair skin and washes it out.','Suits & More'];
    if(S.l<=60) return ['A deeper suit gives fair skin flattering contrast.','Suits & More'];
  }
  if(skin.id==='deep') return S.l>60 ? ['Light, bright suits pop beautifully on deep skin.','The Coolist'] : ['A classic, dependable choice for deep skin.','The Coolist'];
  if(skin.id==='olive'){
    if(S.id==='tan') return ['Pale beige can make olive skin look sallow.','Palette Hunt'];
    if(S.temp==='warm'||S.id==='olive') return ['Warm browns and olive flatter olive undertones.','Palette Hunt'];
  }
  if(skin.id==='medium') return ['Medium skin is versatile — warm & jewel tones shine.','Suits & More'];
  return ['Solid contrast with your skin tone.','Suits & More'];
}

function bestTie(S,H){
  let best=TIES[0], bs=-9;
  TIES.forEach(t=>{
    let v=scoreSuitTie(S,t)*0.8 + scoreShirtTie(H,t)*0.5;
    if(t.universal) v-=0.3;                            /* let characterful ties surface */
    if(t.temp===S.temp && S.temp!=='neutral') v+=0.35; /* echo the suit's warmth/coolth */
    if(t.id===S.id) v-=1;                              /* don't suggest the suit colour back */
    if(v>bs){ bs=v; best=t; }
  });
  return best;
}
function rankBy(items,fn){
  return items.map((x,i)=>({item:x, raw:fn(x), order:i}))
              .sort((a,b)=> b.raw-a.raw || a.order-b.order);
}

    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".10"/></linearGradient>
    <filter id="fls" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(40,30,50,.16)"/></filter></defs>
    <g filter="url(#fls)" transform="translate(100,118) scale(0.6)">
      <path d="M-78,150 L-66,8 C-62,-14 -40,-30 -16,-36 L0,30 L16,-36 C40,-30 62,-14 66,8 L78,150 Z" fill="${suit}"/>
      <path d="M-78,150 L-66,8 C-62,-14 -40,-30 -16,-36 L0,30 L16,-36 C40,-30 62,-14 66,8 L78,150 Z" fill="url(#fl)"/>
      <path d="M-16,-36 L0,30 L0,46 L-44,-4 C-40,-18 -28,-30 -16,-36 Z" fill="${lap}" opacity="${lapOp}"/>
      <path d="M16,-36 L0,30 L0,46 L44,-4 C40,-18 28,-30 16,-36 Z" fill="${lap}" opacity="${lapOp}"/>
      <ellipse cx="0" cy="-40" rx="13" ry="8" fill="${suit}"/>
    </g>
    <text x="100" y="232" ${T}>Suit</text>
    <g filter="url(#fls)" transform="translate(260,118) scale(0.6)">
      <path d="M-58,120 L-54,4 C-52,-12 -38,-22 -22,-26 L0,8 L22,-26 C38,-22 52,-12 54,4 L58,120 Z" fill="${shirt}"/>
      <path d="M-22,-26 L0,8 L-18,-6 L-30,-18 C-28,-22 -25,-25 -22,-26 Z" fill="#000" opacity=".06"/>
      <path d="M22,-26 L0,8 L18,-6 L30,-18 C28,-22 25,-25 22,-26 Z" fill="#000" opacity=".06"/>
      <line x1="0" y1="14" x2="0" y2="116" stroke="#000" stroke-opacity=".06" stroke-width="2"/>
    </g>
    <text x="260" y="232" ${T}>Shirt</text>
    <g filter="url(#fls)" transform="translate(100,300)">
      ${tux?`<rect x="-9" y="-13" width="18" height="24" rx="4" fill="${tie}"/><path d="M0,-1 L-32,-16 L-32,14 Z" fill="${tie}"/><path d="M0,-1 L32,-16 L32,14 Z" fill="${tie}"/><path d="M0,-1 L-32,-16 L-32,14 Z" fill="#000" opacity=".12"/>`
           :`<path d="M-10,-44 L10,-44 L7,-22 L-7,-22 Z" fill="${tie}"/><path d="M-7,-22 L7,-22 L13,40 L0,62 L-13,40 Z" fill="${tie}"/><path d="M-7,-22 L7,-22 L13,40 L0,62 L-13,40 Z" fill="#fff" opacity=".05"/>`}
    </g>
    <text x="100" y="384" ${T}>Tie</text>
    <circle cx="260" cy="296" r="40" fill="${skin}" filter="url(#fls)"/>
    <text x="260" y="384" ${T}>Skin</text>`;
}
function figSwatch(su,sh,ti,sk){
  const t=[['Skin',sk],['Suit',su],['Shirt',sh],['Tie',ti]];
  return `<div class="swwrap">`+t.map(([cat,o])=>`
    <div class="sw" style="${swatchStyle(o)}"><small>${cat}</small><b>${o?o.name:'—'}</b></div>`).join('')+`</div>`;
}
function renderStage(){
  const su=byId(SUITS,state.suit), sh=byId(SHIRTS,state.shirt), ti=byId(TIES,state.tie), sk=byId(SKINS,state.skin);
  const base=su?su.hex:'#444', checked=!!(su&&su.pattern==='check');
  const S=checked?'url(#suitpat)':base, H=sh?sh.hex:'#eee', T=ti?ti.hex:'#888', K=sk?sk.hex:'#d9a980', hair=sk?sk.hair:'#3a2a1e', tux=!!(su&&su.tux);
  const pat=checked?`<pattern id="suitpat" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="${base}"/><path d="M0 0H22M0 0V22" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/><path d="M11 0V22M0 11H22" stroke="rgba(255,255,255,.08)" stroke-width="1"/></pattern>`:'';
  const trouser=(su&&su.id==='whitetux')?'#1b1b22':S;   /* white dinner jacket = black trousers */
  let html;
  if(state.view==='full')        html=`<svg class="figure figfull" viewBox="0 0 220 540">${figFull(S,H,T,K,hair,tux,trouser,pat)}</svg>`;
  else if(state.view==='flatlay')html=`<svg class="figure" viewBox="0 0 360 400">${figFlat(S,H,T,K,tux,pat)}</svg>`;
  else if(state.view==='swatch') html=figSwatch(su,sh,ti,sk);
  else                           html=`<svg class="figure" viewBox="0 0 360 430">${figAvatar(S,H,T,K,hair,tux,pat)}</svg>`;
  document.getElementById('stage').innerHTML=html;
  [...document.querySelectorAll('.vbtn')].forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
}
function overall(){
  const p=[];
  const su=byId(SUITS,state.suit), sh=byId(SHIRTS,state.shirt), ti=byId(TIES,state.tie), sk=byId(SKINS,state.skin);
  if(sk&&su) p.push(scoreSkinSuit(sk,su));
  if(su&&sh) p.push(scoreSuitShirt(su,sh));
  if(su&&ti) p.push(scoreSuitTie(su,ti));
  if(sh&&ti) p.push(scoreShirtTie(sh,ti));
  if(!p.length) return {label:'—',cls:'t1'};
  const avg=p.reduce((a,b)=>a+b,0)/p.length, worst=Math.min(...p);
  if(worst<1.0) return {label:'Bad — a piece clashes',cls:'t0'};  /* one weak link spoils it */
  if(avg>=2.2) return {label:'Excellent look',cls:'t2'};
  if(avg>=1.15) return {label:'Good look',cls:'t1'};
  return {label:'Bad — reconsider',cls:'t0'};
}
function overallReason(){
  const su=byId(SUITS,state.suit), sh=byId(SHIRTS,state.shirt), ti=byId(TIES,state.tie), sk=byId(SKINS,state.skin);
  const c=[];
  if(sk&&su) c.push([scoreSkinSuit(sk,su), explainSkinSuit(sk,su)]);
  if(su&&sh) c.push([scoreSuitShirt(su,sh), explainSuitShirt(su,sh)]);
  if(su&&ti) c.push([scoreSuitTie(su,ti), explainSuitTie(su,ti)]);
  if(sh&&ti) c.push([scoreShirtTie(sh,ti), explainShirtTie(sh,ti)]);
  if(!c.length) return null;
  c.sort((a,b)=>a[0]-b[0]);      /* weakest link drives the explanation */
  return c[0][1];
}
function renderLookBar(){
  const r=overall();
  document.getElementById('rating').innerHTML=`<span class="lab">Overall</span><span class="pill ${r.cls}">${r.label}</span>`;
  const e=overallReason();
  document.getElementById('overallWhy').innerHTML = e ? `${e[0]} <span class="src">— ${e[1]}</span>` : '';
  const rows=[['Skin',byId(SKINS,state.skin)],['Suit',byId(SUITS,state.suit)],['Shirt',byId(SHIRTS,state.shirt)],['Tie',byId(TIES,state.tie)]];
  document.getElementById('lookRows').innerHTML=rows.map(([l,o])=>`
    <div class="look-row"><div class="sw" style="${swatchStyle(o)}"></div>
    <div><div class="lbl">${l}</div><div class="val">${o?o.name:'—'}</div></div></div>`).join('');
}

/* ===================== UI BUILDERS ===================== */
function renderSkin(){
  document.getElementById('skinGrid').innerHTML=SKINS.map(s=>`
    <div class="skin-opt ${state.skin===s.id?'active':''}" data-skin="${s.id}">
      <div class="dot" style="background:${s.hex}"></div><span>${s.name}</span></div>`).join('');
}
function renderTabs(){ [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('active',t.dataset.mode===state.mode)); }

/* swatch background — adds a windowpane check grid for checkered suits */
function swatchStyle(o){
  if(o && o.pattern==='check')
    return `background-color:${o.hex};background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 11px),repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 11px)`;
  return `background:${o?o.hex:'#ddd'}`;
}
function recItem(o,tier,why,src,activeId){
  return `<div class="rec-item ${activeId===o.id?'active':''}" data-recid="${o.id}">
    <div class="sw" style="${swatchStyle(o)}"></div>
    <div class="info"><div class="nm">${o.name}</div><div class="why">${why}${src?` <span class="src">— ${src}</span>`:''}</div></div>
    <div class="tag t${tier}">${TIER[tier]}</div></div>`;
}
function pickGrid(items,activeId){
  return `<div class="pick-grid">`+items.map(o=>`
    <div class="pick ${activeId===o.id?'active':''}" data-pickid="${o.id}">
      <div class="chip" style="${swatchStyle(o)}"></div>
      <div class="nm">${o.name}</div>${o.tux?'<div class="tux">TUX</div>':o.pattern?'<div class="tux">CHECK</div>':''}
    </div>`).join('')+`</div>`;
}
/* weakest-link aware: a piece that clashes with EITHER side is rated down */
function combine(a,b){ return Math.min(a,b)*0.5 + (a+b)*0.25; }
/* rank every option best→worst and show all, each tagged Excellent / Good / Bad with a reason */
function recListScored(items, scoreFn, explainFn, activeId){
  return items.map((o,i)=>({o, raw:scoreFn(o), i}))
    .sort((x,y)=> y.raw-x.raw || x.i-y.i)
    .map(x=>{ const e=explainFn(x.o); return recItem(x.o, toTier(x.raw), e[0], e[1], activeId); }).join('');
}

/* ===================== PANELS ===================== */
function renderPanel(){
  const p=document.getElementById('panel');
  ({suit:fromSuit, shirt:fromShirt, tie:fromTie, skin:fromSkin, matrix:matrix})[state.mode](p);
}
function skinNote(){ const sk=byId(SKINS,state.skin); return `<div class="note"><b>${sk.name} skin:</b> ${sk.note}</div>`; }

function fromSuit(p){
  const S=byId(SUITS,state.suit), H=byId(SHIRTS,state.shirt);
  p.innerHTML=`<h2>Pick your suit</h2>
    <p class="hint">Every shirt &amp; tie is rated against this suit (and your current shirt). Tuxedos use black-tie rules.</p>
    ${pickGrid(SUITS,state.suit)}
    <div class="rec-wrap">
      <div class="rec-col"><h3>Shirts</h3>${recListScored(SHIRTS, sh=>scoreSuitShirt(S,sh), sh=>explainSuitShirt(S,sh), state.shirt)}</div>
      <div class="rec-col"><h3>Ties</h3>${recListScored(TIES, t=>combine(scoreSuitTie(S,t),scoreShirtTie(H,t)), t=>{const a=scoreSuitTie(S,t),b=scoreShirtTie(H,t);return a<=b?explainSuitTie(S,t):explainShirtTie(H,t);}, state.tie)}</div>
    </div>${skinNote()}`;
}
function fromShirt(p){
  const H=byId(SHIRTS,state.shirt), sk=byId(SKINS,state.skin);
  p.innerHTML=`<h2>Pick your shirt</h2>
    <p class="hint">Every suit &amp; tie is rated against this shirt (suits also weigh your skin tone).</p>
    ${pickGrid(SHIRTS,state.shirt)}
    <div class="rec-wrap">
      <div class="rec-col"><h3>Suits</h3>${recListScored(SUITS, su=>combine(scoreSuitShirt(su,H),scoreSkinSuit(sk,su)), su=>{const a=scoreSuitShirt(su,H),b=scoreSkinSuit(sk,su);return a<=b?explainSuitShirt(su,H):explainSkinSuit(sk,su);}, state.suit)}</div>
      <div class="rec-col"><h3>Ties</h3>${recListScored(TIES, t=>scoreShirtTie(H,t), t=>explainShirtTie(H,t), state.tie)}</div>
    </div>${skinNote()}`;
}
function fromTie(p){
  const T=byId(TIES,state.tie), H=byId(SHIRTS,state.shirt);
  p.innerHTML=`<h2>Pick your tie</h2>
    <p class="hint">Have a favourite tie? Every suit &amp; shirt is rated for it — clashes are flagged Bad.</p>
    ${pickGrid(TIES,state.tie)}
    <div class="rec-wrap">
      <div class="rec-col"><h3>Suits</h3>${recListScored(SUITS, su=>scoreSuitTie(su,T), su=>explainSuitTie(su,T), state.suit)}</div>
      <div class="rec-col"><h3>Shirts</h3>${recListScored(SHIRTS, sh=>scoreShirtTie(sh,T), sh=>explainShirtTie(sh,T), state.shirt)}</div>
    </div>${skinNote()}`;
}
function fromSkin(p){
  const sk=byId(SKINS,state.skin);
  p.innerHTML=`<h2>Suits for ${sk.name.toLowerCase()} skin</h2>
    <p class="hint">Each suit colour rated for your skin tone — flattering ones are Excellent, washed-out or clashing ones are Bad.</p>
    ${skinNote()}
    <div class="rec-wrap">
      <div class="rec-col"><h3>Suits for you</h3>${recListScored(SUITS, su=>scoreSkinSuit(sk,su), su=>explainSkinSuit(sk,su), state.suit)}</div>
      <div class="rec-col"><h3>Then build the look</h3>${pickGrid(SUITS,state.suit)}</div>
    </div>`;
}
function matrix(p){
  const sk=byId(SKINS,state.skin);
  let head=`<tr><th class="mx-corner">Suit \\ Shirt</th>`;
  SHIRTS.forEach(sh=>head+=`<th><div class="mx-colhead"><div class="chip" style="background:${sh.hex}"></div><div class="t">${sh.name}</div></div></th>`);
  head+=`</tr>`;
  let body='';
  SUITS.forEach(su=>{
    const ss=scoreSkinSuit(sk,su), dim=toTier(ss)===0?'dim':'', star=toTier(ss)===2?'<span class="star">★</span>':'';
    body+=`<tr class="mx-row ${dim}"><td><div class="mx-rowhead"><div class="chip" style="${swatchStyle(su)}"></div><div class="t">${su.name} ${star}</div></div></td>`;
    SHIRTS.forEach(sh=>{
      const tier=toTier(scoreSuitShirt(su,sh)), bt=bestTie(su,sh);
      const sel=(state.suit===su.id&&state.shirt===sh.id)?'sel':'';
      body+=`<td><div class="mx-cell cell${tier} ${sel}" data-su="${su.id}" data-sh="${sh.id}" data-tie="${bt.id}">
        <div class="tie" style="background:${bt.hex}" title="${bt.name} tie"></div></div></td>`;
    });
    body+=`</tr>`;
  });
  p.innerHTML=`<h2>The full matrix</h2>
    <p class="hint">Rows = suit, columns = shirt. Each dot is the best tie for that pairing; cell colour rates the suit + shirt match.</p>
    <div class="matrix-scroll"><table class="matrix">${head}${body}</table></div>
    <div class="legend">
      <div class="k"><span class="b cell2"></span>Excellent</div>
      <div class="k"><span class="b cell1"></span>Good</div>
      <div class="k"><span class="b cell0"></span>Bad</div>
      <div class="k"><span class="star" style="color:var(--accent)">★</span>= best for ${sk.name.toLowerCase()} skin</div>
    </div>
    <p class="mx-help">Faded rows are a bad match for your skin tone. Tap any cell to load that combination into your live look on the left.</p>`;
}

/* ===================== EVENTS ===================== */
function rerender(){ renderSkin(); renderTabs(); renderPanel(); renderStage(); renderLookBar(); }
function refresh(){ renderPanel(); renderStage(); renderLookBar(); }

document.getElementById('viewSwitch').addEventListener('click',e=>{
  const el=e.target.closest('[data-view]'); if(!el) return; state.view=el.dataset.view; renderStage();
});

document.getElementById('skinGrid').addEventListener('click',e=>{
  const el=e.target.closest('[data-skin]'); if(!el) return; state.skin=el.dataset.skin; rerender();
});
document.getElementById('tabs').addEventListener('click',e=>{
  const el=e.target.closest('[data-mode]'); if(!el) return; state.mode=el.dataset.mode; rerender();
});
document.getElementById('panel').addEventListener('click',e=>{
  const cell=e.target.closest('[data-su]');
  if(cell){ state.suit=cell.dataset.su; state.shirt=cell.dataset.sh; state.tie=cell.dataset.tie; refresh(); return; }
  const pick=e.target.closest('[data-pickid]');
  if(pick){
    const id=pick.dataset.pickid, sk=byId(SKINS,state.skin);
    if(state.mode==='suit'||state.mode==='skin'){
      state.suit=id; const S=byId(SUITS,id);
      state.shirt=rankBy(SHIRTS,sh=>scoreSuitShirt(S,sh))[0].item.id;
      state.tie=bestTie(S,byId(SHIRTS,state.shirt)).id;
    } else if(state.mode==='shirt'){
      state.shirt=id; const H=byId(SHIRTS,id);
      state.suit=rankBy(SUITS,su=>scoreSuitShirt(su,H)*0.75+scoreSkinSuit(sk,su)*0.4)[0].item.id;
      state.tie=bestTie(byId(SUITS,state.suit),H).id;
    } else if(state.mode==='tie'){
      state.tie=id; const T=byId(TIES,id);
      state.suit=rankBy(SUITS,su=>scoreSuitTie(su,T))[0].item.id;
      state.shirt=rankBy(SHIRTS,sh=>scoreSuitShirt(byId(SUITS,state.suit),sh)*0.6+scoreShirtTie(sh,T)*0.6)[0].item.id;
    }
    refresh(); return;
  }
  const rec=e.target.closest('[data-recid]');
  if(rec){
    const id=rec.dataset.recid, h=rec.closest('.rec-col').querySelector('h3').textContent.toLowerCase();
    if(h.includes('suit')) state.suit=id; else if(h.includes('shirt')) state.shirt=id; else if(h.includes('tie')) state.tie=id;
    refresh();
  }
});

/* ===================== INIT ===================== */
rerender();
</script>
</body>
</html>
